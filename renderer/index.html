<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIOS Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply the saved theme to <html> BEFORE any styles or JS load. App.tsx
      mirrors the user's theme to localStorage on every change so this read
      is synchronous and accurate. First launch (no saved value) falls back
      to "light" — matches the inline boot splash colors. Without this
      script, a user with dark theme would see a light boot splash flash
      before React mounts and corrects the attribute.
    -->
    <script>
      try {
        var t = localStorage.getItem("aios-theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* ignore — fall back to default sheet */ }
      // Computer Control popup (BrowserWindow opened by main/control-popup.ts)
      // loads this same index.html with ?aios-control=1. Two things differ:
      //   1. The body must be transparent so the dark rounded panel inside
      //      can paint with a transparent margin around the rounded corners.
      //   2. The full-window paper boot splash would look broken (small
      //      offset, sage italic mark in a 360x520 frame) — hide it.
      try {
        if (/[?&]aios-control=1\b/.test(window.location.search) ||
            /[?&]aios-control-bubble=1\b/.test(window.location.search) ||
            /[?&]aios-cursor-overlay=1\b/.test(window.location.search)) {
          document.documentElement.setAttribute("data-control-popup", "1");
        }
      } catch (e) {}
    </script>
    <style>
      [data-control-popup="1"] html,
      [data-control-popup="1"] body,
      html[data-control-popup="1"],
      html[data-control-popup="1"] body { background: transparent !important; }
      html[data-control-popup="1"] #aios-boot-splash { display: none !important; }
    </style>
    <!--
      Boot splash — paints before any JS/CSS bundle has loaded so the user
      never sees a white frame between the Electron window opening and React
      mounting. Once App.tsx renders, an effect tears `#aios-boot-splash`
      down and the in-React splash takes over seamlessly. All styles are
      inline on purpose; no external stylesheet is loaded by this point.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fafaf7;
        color: #2a2a2a;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #aios-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf7;
        z-index: 9999;
      }
      #aios-boot-splash .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 38px 48px;
      }
      #aios-boot-splash .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(61, 90, 74, 0.18);
        border-top-color: #3d5a4a;
        animation: aios-boot-spin 0.9s linear infinite;
      }
      @keyframes aios-boot-spin {
        to { transform: rotate(360deg); }
      }
      #aios-boot-splash .label {
        font-size: 13px;
        letter-spacing: 0.02em;
        color: #6b7280;
      }
      #aios-boot-splash .brand {
        display: block;
        width: 48px;
        height: 48px;
      }
      #aios-boot-splash .brand-ring {
        fill: #F3EFE8;
      }
      #aios-boot-splash .brand-dot {
        fill: #1A1A1C;
      }
      /*
        Dark-theme overrides for the boot splash so users on dark theme
        don't see a flash of light paper before React mounts and applies
        the dark tokens. The inline script above sets data-theme on <html>
        from localStorage before this stylesheet is evaluated, so these
        rules take effect on the very first paint.
      */
      [data-theme="dark"] html,
      [data-theme="dark"] body,
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #1a1a18;
        color: #f0ece8;
      }
      [data-theme="dark"] #aios-boot-splash,
      html[data-theme="dark"] #aios-boot-splash {
        background: #1a1a18;
      }
      [data-theme="dark"] #aios-boot-splash .spinner,
      html[data-theme="dark"] #aios-boot-splash .spinner {
        border-color: rgba(156, 175, 155, 0.22);
        border-top-color: #9caf9b;
      }
      [data-theme="dark"] #aios-boot-splash .brand-ring,
      html[data-theme="dark"] #aios-boot-splash .brand-ring {
        fill: #2a2a28;
      }
      [data-theme="dark"] #aios-boot-splash .brand-dot,
      html[data-theme="dark"] #aios-boot-splash .brand-dot {
        fill: #9caf9b;
      }
      [data-theme="dark"] #aios-boot-splash .label,
      html[data-theme="dark"] #aios-boot-splash .label {
        color: #a3a3a3;
      }
      @media (prefers-color-scheme: dark) {
        html[data-theme="auto"], html[data-theme="auto"] body {
          background: #1a1a18;
          color: #f0ece8;
        }
        html[data-theme="auto"] #aios-boot-splash {
          background: #1a1a18;
        }
        html[data-theme="auto"] #aios-boot-splash .spinner {
          border-color: rgba(156, 175, 155, 0.22);
          border-top-color: #9caf9b;
        }
        html[data-theme="auto"] #aios-boot-splash .brand-ring {
          fill: #2a2a28;
        }
        html[data-theme="auto"] #aios-boot-splash .brand-dot {
          fill: #9caf9b;
        }
        html[data-theme="auto"] #aios-boot-splash .label {
          color: #a3a3a3;
        }
      }
    </style>
  </head>
  <body>
    <div id="aios-boot-splash" aria-hidden="true">
      <div class="card">
        <svg class="brand" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AIOS">
          <circle class="brand-ring" cx="32" cy="32" r="30"/>
          <circle class="brand-dot" cx="32" cy="32" r="8.3"/>
        </svg>
        <div class="spinner"></div>
        <div class="label" id="aios-boot-label">Loading your workspace…</div>
      </div>
    </div>
    <script>
      // Rotate through plausible "what we're doing" labels so the user sees
      // continuous progress instead of one frozen line. The text doesn't need
      // to map to literal subprocess steps — it just has to feel alive while
      // the PyInstaller binary expands, Defender scans it, and the Python
      // sidecar warms up. After ~22s we switch to the explicit
      // "first launch can take a minute" copy so any further wait doesn't
      // feel broken.
      var aiosSplashStages = [
        { at: 4000,  text: "Verifying Claude runtime…" },
        { at: 9000,  text: "Starting the AIOS engine…" },
        { at: 14000, text: "Almost ready, hang tight…" },
        { at: 22000, text: "Setting up for the first time — this can take up to a minute." }
      ];
      aiosSplashStages.forEach(function (s) {
        setTimeout(function () {
          var label = document.getElementById("aios-boot-label");
          if (label) label.innerText = s.text;
        }, s.at);
      });
    </script>
    <div id="root"></div>
    <div style="position: fixed; right: 0.002px; bottom: 0.002px; font-size: 6px; font-weight: 300; color: rgba(228, 228, 231, 0.2); z-index: 9999; pointer-events: none; user-select: none; letter-spacing: 0;">VRK</div>
    <script type="module" src="/src/App.tsx"></script>
  </body>
</html>
