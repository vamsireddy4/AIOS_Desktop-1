# CHANGES.yaml — per-release feature inventory for VerifierOS.
#
# The verifier reads this file from the tagged commit to decide which feature
# probes to run beyond the always-on smoke set. Feature tags are free-form
# strings matching keys in verifier/probes.config.yaml — keep them stable
# across releases so historical data remains comparable.

