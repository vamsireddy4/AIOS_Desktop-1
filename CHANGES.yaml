  - tag: v0.2.72
    features:
      - goal-autonomous-loop
      - plan-mode-toggle
      - plan-card-cli-style
      - clickable-artifact-chips
      - linked-folder-browser
      - control-popup-tabs
      - comfortable-dark-theme
      - chat-column-wider
      - mention-chips-inline
      - mac-update-applications-check
      - github-url-fallback-fix
    notes: First bundle release out of the consolidated everyai-com/AIOS_Desktop pipeline. Mac auto-update is now reliable for users who have the app in /Applications (a one-time dialog prompts them to move it on first launch if not). Headline new feature is /goal — Claude Code-style autonomous loop with Haiku verifier and clickable artifact chips per turn.

  - tag: v0.3.0
    features:
      - cancelled-error-mislabel-fix
      - relogin-chip-on-401
      - connector-label-memory-override
      - context-os-reads-imports-first
      - haiku-default-model
    notes: |
      Bundle 1 release — first under the new "5-10 fixes per bundle, themed" cadence (see plans/2026-05-28-bundled-release-roadmap.md in the workspace). Theme: install + auth experience. Five related improvements:
      (1) host.py no longer treats exit code 1 as "Cancelled." — real errors (auth failures, missing CLI, API errors) now surface their actual message instead of being silently mislabeled.
      (2) When Claude CLI returns 401 / "Please run /login", the chat shows a Re-login chip that copies `claude /login` to clipboard and opens Terminal — no more raw JSON in the chat.
      (3) Composio system prompt strengthened with a "memory override" clause: if an earlier turn asked about a connector that now appears in the connected list, Claude is told explicitly to proceed without re-asking. Kills the "do you have a GitHub account?" amnesia.
      (4) ContextOS install.md gets a new Step 0 — if context/import/ has files, read them all first, only ask about gaps. The A/B/C SCOPING menu only appears when the import folder is empty.
      (5) Default chat model flipped from "default" to Haiku 4.5. Returning users with a persisted preference keep their choice. Speed is the #1 churn theme — Haiku at 1-3s round-trip beats Sonnet at 5-15s for the first-10-minute experience.

  - tag: v0.3.1
    features:
      - opus-default-model
    notes: Default chat model flipped from Haiku (set in v0.3.0) to Opus. Reasoning — for AIOS's positioning, the smartest model per turn produces the best demos and the best work product, which matters more than raw speed. Sonnet and Haiku remain one click away in the model pill for when speed beats depth. Users with a persisted chat_model setting keep their choice.

  - tag: v0.3.2
    features:
      - dot-logo-unified
    notes: Brand mark unified across every surface. The "dot" logo from the macOS / Windows app icon (paper-coloured circle with a small ink dot at centre) now also shows in the sidebar header, the boot splash, and any other in-app BrandMark callsite. Previously the in-app mark was an italic "A" inside an ink ring + the boot splash was the italic "aios" wordmark — three different brand marks, now one. Dark-theme variants kept (ring darkens to deep grey, dot becomes the sage accent).

  - tag: v0.4.0
    features:
      - context-brief-in-system-prompt
      - composio-friendly-activity-labels
      - ci-intel-mac-curl-retry
    notes: |
      Bundle 2 release — themed "polish + visibility". Three improvements + a CI hardening pass:
      (1) Context brief injected into every chat spawn. Reads context/personal-info.md + business-info.md + strategy.md, distills into a ~600-char paragraph, appends as --append-system-prompt on every claude --print invocation. Result: typing "hi" in a new chat no longer triggers "run /prime to load context" — Claude already knows who you are. Brief returns empty for brand-new workspaces (template-only files) so token cost stays at zero until ContextOS has actually run.
      (2) Activity status strip — friendly labels for Composio tool calls. Previously showed "Calling composio · COMPOSIO_MULTI_EXECUTE_TOOL" — technical. Now shows "Working with your apps", "Gmail: send message", "Google Calendar: list events", etc. The user sees what's happening in their own apps.
      (3) CI Intel Mac matrix: curl to python.org wrapped in a 3-attempt retry loop with 20s/40s backoff. Single DNS blip no longer kills the release (we hit this on v0.3.0).

  - tag: v0.5.0
    features:
      - adaptive-empty-chat-state
      - per-message-run-meta
      - plan-mode-contextual-hint
    notes: |
      Bundle 3 release — themed "make the chat feel like it knows you". Three visibility/polish improvements:
      (1) Adaptive empty-chat state. A brand-new workspace still gets the onboarding cards (import folder / interview / prime / just chat). But once context/*.md has real content, the empty chat instead greets the user by name and offers "do work" chips — "What should I focus on?", "Brief me", "Draft my top priority", "Just chat". Detection via get_context_summary (any core file with >120 chars of non-template prose). Pairs with the v0.4.0 context brief so these chips actually produce personalized answers.
      (2) Per-message run metadata. Each completed assistant turn shows a subtle muted row underneath: "Opus · 4.2s · $0.03". Removes the "is it slow because it's hard or because it's broken?" ambiguity. Persisted on the message so it survives reload.
      (3) Plan-mode contextual hint. The first time Claude asks a clarifying question (AIOS_ASK) while the user is in default mode, a one-time dismissible chip appears by the mode pill: "Tip: switch to Plan mode (Shift+Tab) so Claude plans before acting." Clicking it switches to Plan mode; dismissed forever via localStorage.

  - tag: v0.6.0
    features:
      - skills-as-capabilities
      - full-toolkit-system-prompt
      - skills-in-modules-ui
    notes: |
      Claude-native foundation — first step of making AIOS use 100% of Claude Code instead of ~30%. Full strategy at plans/2026-05-28-claude-native-roadmap.md. Reframe: let Claude Code be the engine, make AIOS the cockpit; stop reimplementing primitives, expose them.
      (1) Skills as capabilities. The starter kit ships three real model-invoked Skills in .claude/skills/ — daily-brief, prioritize, social-carousel — alongside skill-creator + mcp-integration. Unlike modules, skills need NO install and NO slash command: Claude reaches for them automatically when the user's intent matches the skill's description. Foundation for migrating the whole module system to skills (and the delivery mechanism for the future Knowledge Bank product).
      (2) Full-toolkit system prompt. python/host.py's chat system prompt now tells Claude to use its full native toolkit proactively: invoke Skills by intent, call TodoWrite for any 3+ step task (AIOS surfaces the todos live), delegate independent sub-tasks to subagents in parallel, think/plan before big or ambiguous work.
      (3) Skills in the Modules screen. New list_skills IPC + a "Skills · always on" panel so users SEE what their AIOS already does on its own, with no install and no commands to memorize.

  - tag: v0.7.0
    features:
      - effort-pill-control
      - dynamic-workflows-ultracode
    notes: |
      Workflows Phase 1 — the effort/reasoning control, the on-ramp to Claude Code's dynamic workflows. Roadmap at plans/2026-05-29-workflows-roadmap.md.
      (1) New effort pill next to the model + mode pills: Auto (no flag, CLI default) / Deep (--effort xhigh) / Max (--effort max) / Workflows (--effort ultracode). Persisted in SQLite (chat_effort). Auto and the reasoning levels work on the current CLI today.
      (2) Dynamic workflows. Selecting "Workflows" passes --effort ultracode, which makes Claude write a JS orchestration script and run it across many agents (up to 1000, 16 concurrent) with only the final report returning to chat. Requires Claude Code 2.1.154+. CRITICAL SAFETY: the Python sidecar (host.py _effort_flags) detects the CLI version and gracefully degrades ultracode -> xhigh on older CLIs, so selecting Workflows never errors the spawn — it just lights up for real once the user's CLI updates (Claude Code auto-updates).
      Next (Phase 2, v0.8.0): "Save as workflow" + a Workflows library so a good multi-agent run becomes a one-click rerunnable process.

  - tag: v0.8.0
    features:
      - workflows-library-panel
      - list-workflows-ipc
      - workflows-version-nudge
    notes: |
      Workflows Phase 2 — readiness. Builds the infrastructure for saved/rerunnable dynamic workflows without shipping any dead UI on CLIs that don't have workflows yet.
      (1) list_workflows IPC (mirrors list_skills): reads .claude/workflows/, tolerant of flat-file or directory layouts and .md/.js/.ts, returns [] when the dir is absent. Wired through all four cross-stack places; dispatch test validates it.
      (2) Workflows library panel in the Modules screen — renders ONLY when at least one workflow exists, so there is no empty dead panel on a pre-2.1.154 CLI. Each saved workflow is a card with a Run button that invokes its /<name> command. Lights up automatically the moment the user saves their first workflow.
      (3) Version-aware unlock nudge: when the user selects the "Workflows" effort on a CLI older than 2.1.154, the composer shows an inline note — workflows need 2.1.154+, update to unlock, running as Deep meanwhile. The honest, testable-today piece that actually moves users toward enabling workflows.
      Phase 3 (next): converge /goal + the agents canvas onto native workflows once the CLI floor is met.

  - tag: v0.8.1
    features:
      - workflows-trigger-fix
    notes: |
      Correctness fix for the Workflows effort option shipped in v0.7.0/v0.8.0. Verified empirically against the now-installed Claude Code 2.1.156 + the official workflows doc: "ultracode" is NOT a valid --effort flag value (the flag only accepts low/medium/high/xhigh/max) — passing --effort ultracode is a hard error on every version. The earlier implementation would have errored every "Workflows" spawn on a 2.1.154+ CLI.
      The real headless trigger (confirmed by running it) is the word "workflow" in the prompt — Claude then writes and runs a multi-agent orchestration and returns the final report, even in claude --print (no approval prompt in -p mode).
      Fix: _effort_flags now maps ultracode -> xhigh (a valid level) and never emits ultracode. When the user picks "Workflows" AND the CLI is >= 2.1.154, run_claude prepends "Run this as a workflow." to the prompt to trigger the workflow runtime, and widens the spawn timeout to 30 min (workflows spawn many agents). On older CLIs it runs at xhigh and the existing UI nudge tells the user to update. Verified xhigh/max also degrade gracefully on Haiku (no error).

  - tag: v0.8.2
    features:
      - effort-pill-label-fix
      - empty-state-centering-fix
    notes: |
      UI polish from live testing on v0.8.1.
      (1) Duplicate "Auto" pills fixed. The effort pill and the mode pill both defaulted to the label "Auto", sitting side by side — ambiguous. Effort default label is now "Standard" (id unchanged, behavior identical) so the two pills read distinctly: [sparkle] Standard / Deep / Max / Workflows for reasoning, [lightning] Auto / Plan / Edits for permission mode.
      (2) Empty-chat state centering + clipping fix. The empty state used justify-content:center on the scroll container, which clips BOTH ends when the content (orb + greeting + 4 action cards) is taller than the viewport and makes the top unreachable — that was cutting off the action cards just above the composer. Replaced with margin:auto centering (+ max-width 640px), which centers when there's room and falls back to top-aligned + scrollable when tall. No more clipped cards or dead empty void.

  - tag: v0.8.3
    features:
      - workflow-ipc-timeout-fix
      - workflow-progress-indicator
    notes: |
      Workflow reliability + visibility, from watching a real 24-investor workflow run live in the app.
      (1) LOAD-BEARING FIX — long workflows were being KILLED. The main process gave the Python host a 700s (~11.7 min) IPC ceiling on run_task. Workflows emit NO intermediate stream events while their agents work in the background, so the main process saw silence and aborted healthy runs with "Python host timed out for run_task". Fix: run_task with effort=ultracode now gets a 50-minute ceiling (main/main.ts), and host.py's own workflow timeout is raised to 45 min — so the host's clean timeout wins if it ever trips. A many-agent web-research workflow can now actually finish.
      (2) Workflow progress indicator. While a workflow runs you saw only "Claude is thinking… · 584s" — no idea what was happening. Now the activity strip shows "Running a workflow · 9m 44s" with a sub-line: "agents working in the background — one report at the end. Minutes is normal." Sets expectations so a multi-minute run doesn't look stuck.
